(function(){

const cv = $('cv'), g = cv.getContext('2d');

// ---------- drawing helpers (world units, outlines scale with the camera) ----------

// the song stays on the stage: it fades and dulls the further he is from it
function mixUpdate(){ if (!AC) return; const t = AC.currentTime;
  const d = rag ? Math.max(0, Math.hypot(rag.torso.position.x - STAGE.x, (rag.torso.position.y - STAGE.y) * .6) - 250) : 0;

  if (crowd) crowd.g.gain.setTargetAtTime(state === 'start' ? 0 : .35 / Math.pow(1 + ear / 700, 1.6), t, .2);

let PTS = [];
function buildCurve(){ seed = 20251113; PTS = [[-1600, -700], [-700, -60], [-420, 0], [330, 0], [700, 170], [1150, 470], [1500, 560], [1800, 760], [2300, 1080], [2700, 1150], [3100, 1060], [3400, 1050], [3800, 1330], [4300, 1700], [4700, 1760], [5200, 2050], [5800, 2230], [6250, 2120], [6700, 2200], [7300, 2560], [7900, 2700]];

function gy(x){ const r = gyRaw(x); for (const f of FLATS){ if (x < f.a - 160 || x > f.b + 220) continue; if (x >= f.a && x <= f.b) return f.y; if (x < f.a){ const u = (x - (f.a - 160)) / 160, e = u * u * (3 - 2 * u); return r + (f.y - r) * e; } const u = (x - f.b) / 220, e = u * u * (3 - 2 * u); return f.y + (r - f.y) * e; } return r; }

const SPAN = {roskakatos:[-20, 150], mokki:[-70, 200], halkopino:[-20, 160], bussi:[-20, 200], kioski:[-80, 140], telineet:[-20, 210], muuri:[-20, 290], auto:[-30, 240], sauna:[-30, 180], kerrostalo:[-20, 290], kaljat:[-20, 180]};

const T = {

// the course layout: the same every time, so the street can be learned

// ---------- scoring ----------

// ---------- damage and breaking ----------
function hurt(b, amount, x, y){ const p = b.plugin; if (!p || p.gone || amount <= 0) return;

    if (p.kind === 'car'){ if (old === 0){ sfx('glass_break', .7, {x, y}); shards(x, y - 20, 10); sfx('alarm', .35, {x, y, gap:3}); } if (st === 2){ sfx('metal_strike', .8, {x, y}); award(900, b.position.x, b.position.y - 40, 'AUTO'); } else award(300, b.position.x, b.position.y - 40); return; }
    if (p.mat === 'metal'){ sfx(MAT.metal.snd[Math.floor(rnd() * 3)], .6, {x, y}); award(st === 2 ? 160 : 80, x, y); return; }
    if (st === 1){ if (p.mat === 'wood' && rnd() < .3) sfx('wood_creak', .35, {x, y, gap:.8}); if (p.mat === 'stone') sfx('thud_heavy', .35, {x, y}); return; }

function zap(b){ const p = b.plugin; if (p.zapped) return; p.zapped = true; const x = b.position.x, y = b.position.y; sfx('electric', .8, {x, y, force:true});

  line(x - 150, y - 30, x - 150, y - 250, INK, 9); line(x - 150, y - 30, x - 150, y - 250, C.woodD, 5); line(x + 150, y - 30, x + 150, y - 250, INK, 9); line(x + 150, y - 30, x + 150, y - 250, C.woodD, 5);
  path([[x - 175, y - 250], [x + 175, y - 250], [x + 160, y - 272], [x - 160, y - 272]]); ink('#5a4a3a');
  rr(x - 120, y - 245, 240, 50, 3); ink('#d8cfb4'); g.fillStyle = INK; [[-2, 9], [-1, 17], [0, 25], [1, 17], [2, 9]].forEach(([k, h]) => g.fillRect(x - 96 + (k + 2) * 7, y - 220 - h / 2, 4, h)); g.font = '30px VT323'; g.textAlign = 'left'; g.fillText('VIISTONE', x - 52, y - 210);
  for (let i = 0; i < 6; i++){ const lx = x - 120 + i * 48; disc(lx, y - 186 + Math.sin(i) * 3, 5, '#ffe08a', 2); }

  // the crowd in front
  if (rag && Math.abs(cam.x - x) > 2500) return; }
function drawCrowd(t){ const x = STAGE.x, y = STAGE.y; for (let i = 0; i < 9; i++){ const cx = x - 150 + i * 36 + (i % 2) * 8, cy = y + 34 + (i % 3) * 8, bob = Math.sin(t * 6 + i) * 2.5;
    rr(cx - 15, cy - 6 + bob, 30, 40, 12); ink(['#2e2b2a', '#3a3530', '#2a2d33'][i % 3]); disc(cx, cy - 14 + bob, 11, '#c7a184', 2.5); if (i % 2) { g.beginPath(); g.arc(cx, cy - 16 + bob, 11.5, Math.PI, 0); ink('#3a3d38', 2.5); }
    if (i % 4 === 1){ line(cx + 10, cy + bob, cx + 18, cy - 30 + bob + Math.sin(t * 6 + i) * 6, INK, 8); line(cx + 10, cy + bob, cx + 18, cy - 30 + bob + Math.sin(t * 6 + i) * 6, '#3a3530', 4); } } }

function drawBody(b){ const p = b.plugin; if (!p || p.gone) return; const x = b.position.x, y = b.position.y, a = b.angle, w = p.w, h = p.h;
  switch (p.kind){
  case 'pad': at(x, y, 0, () => { rr(-w / 2, -h / 2, w, h + 40, 4); ink('#5f5a52'); g.fillStyle = '#6e6960'; g.fillRect(-w / 2 + 4, -h / 2 + 4, w - 8, 5); }); return;
  case 'ramp': path(p.v.map(v => [v.x, v.y])); ink(C.wood); for (let i = 1; i < 5; i++){ const u = i / 5; line(p.v[0].x + (p.v[1].x - p.v[0].x) * u, p.v[0].y + (p.v[1].y - p.v[0].y) * u, p.v[0].x + (p.v[2].x - p.v[0].x) * u, p.v[0].y + (p.v[2].y - p.v[0].y) * u, C.woodD, 2); } return;
  case 'stage': return;
  case 'backdrop': at(x, y, 0, () => { rr(-20, -280, 40, 560, 3); ink('#3a302a'); for (let i = -260; i < 270; i += 40) line(-16, i, 16, i + 10, '#2a221d', 2); }); return;
  case 'speaker': at(x, y, a, () => { rr(-20, -40, 40, 80, 4); ink('#1f1f22'); disc(0, -18, 11, '#2c2c30', 2.5); disc(0, -18, 4, '#111', 0); disc(0, 16, 14, '#2c2c30', 2.5); disc(0, 16, 5, '#111', 0); }); return;
  case 'hat': at(x, y, a, () => { g.beginPath(); g.arc(0, 4, 15, Math.PI, 0); ink(C.beanie); rr(-16, 0, 32, 7, 3); ink('#555a52', 2.5); disc(3, -12, 3.5, C.beanie, 2); }); return;
  case 'car': at(x, y, a, () => { path([[-75, 10], [-72, -8], [-48, -10], [-30, -36], [36, -36], [52, -12], [75, -8], [75, 14], [-75, 14]]); ink(p.st === 2 ? '#5a1a14' : '#7a2c22');
      const glassCol = p.st ? '#1d1e22' : 'rgba(160,205,215,.7)'; path([[-26, -12], [-14, -31], [2, -31], [2, -12]]); ink(glassCol, 2.5); path([[8, -12], [8, -31], [32, -31], [44, -12]]); ink(glassCol, 2.5);
      if (p.st){ line(10, -28, 24, -16, C.glassL, 1.5); line(-20, -16, -6, -28, C.glassL, 1.5); } if (p.st === 2){ path([[-10, -36], [4, -26], [18, -36]]); ink('#4a120d', 2); }
      disc(-46, 14, 13, '#1a1a1a', LW); disc(-46, 14, 5, '#8d8a82', 2); disc(46, 14, 13, '#1a1a1a', LW); disc(46, 14, 5, '#8d8a82', 2); rr(66, -6, 8, 5, 1); ink('#fff1c4', 1.5); }); return;
  case 'gas': at(x, y, a, () => { rr(-11, -15, 22, 34, 9); ink(C.red); rr(-5, -23, 10, 9, 2); ink(C.metal, 2.5); line(-6, -6, -6, 12, '#d86a52', 2.5); g.fillStyle = INK; g.font = '11px VT323'; g.textAlign = 'center'; g.fillText('GAS', 0, 6);
      if (p.armed){ for (let i = 0; i < 4; i++) line(0, -23, (rnd() - .5) * 18, -28 - rnd() * 14, i % 2 ? '#ffd27a' : '#ff8a2a', 2); } }); return;
  case 'fw': at(x, y, a, () => { rr(-26, -12, 52, 24, 3); ink('#c23b3b'); for (let i = 0; i < 4; i++) disc(-18 + i * 12, -12, 4.5, '#2a2620', 2); g.fillStyle = C.cream; g.font = '13px VT323'; g.textAlign = 'center'; g.fillText('PAUKKU', 0, 6);
      if (p.armed){ line(22, -12, 26 + rnd() * 6, -22 - rnd() * 6, '#ffd27a', 2); } }); return;
  case 'jerry': at(x, y, a, () => { path([[-13, -15], [7, -15], [13, -9], [13, 15], [-13, 15]]); ink('#3f6a3a'); rr(-9, -22, 8, 7, 2); ink(C.metal, 2.5); line(-8, -7, 6, 9, '#2b4a28', 2.5); line(6, -7, -8, 9, '#2b4a28', 2.5); }); return;
  case 'cab': at(x, y, a, () => { rr(-17, -25, 34, 50, 3); ink('#8d8a6a'); line(-6, -12, 6, 0, INK, 2.5); line(6, -4, -4, 10, INK, 2.5); if (rnd() < .04){ line(17, -20, 28 + rnd() * 10, -26 + rnd() * 12, '#7ab0d0', 2); } }); return;
  case 'drum': at(x, y, a, () => { rr(-13, -17, 26, 34, 4); ink(p.st === 2 ? '#2f5068' : '#3d6f96'); line(-13, -6, 13, -6, INK, 2); line(-13, 6, 13, 6, INK, 2); g.fillStyle = '#7ab0d0'; g.fillRect(-10, -14, 4, 28); }); return;
  case 'block': drawBlock(b, p, x, y, a, w, h); return; } }
function drawBlock(b, p, x, y, a, w, h){ at(x, y, a, () => { const m = p.mat;
  if (m === 'wood'){ rr(-w / 2, -h / 2, w, h, 3); ink(C.wood); g.save(); g.clip(); const along = w >= h; for (let i = 1; i < 3; i++){ if (along){ const yy = -h / 2 + h * i / 3; line(-w / 2 + 4, yy, w / 2 - 4, yy, C.woodD, 1.6); } else { const xx = -w / 2 + w * i / 3; line(xx, -h / 2 + 4, xx, h / 2 - 4, C.woodD, 1.6); } } g.fillStyle = C.woodL; if (along) g.fillRect(-w / 2 + 3, -h / 2 + 2, w - 6, 2); else g.fillRect(-w / 2 + 2, -h / 2 + 3, 2, h - 6); g.restore(); }
  else if (m === 'glass'){ rr(-w / 2, -h / 2, w, h, 2); ink(C.glass); line(-w / 2 + 5, -h / 2 + 9, -w / 2 + 12, -h / 2 + 4, C.glassL, 2.5); line(-w / 2 + 5, -h / 2 + 18, -w / 2 + 20, -h / 2 + 5, C.glassL, 1.8); }
  else if (m === 'stone'){ rr(-w / 2, -h / 2, w, h, 4); ink(C.stone); g.fillStyle = C.stoneL; g.fillRect(-w / 2 + 3, -h / 2 + 3, w - 6, 3); disc(-w * .2, h * .15, 1.8, C.stoneD, 0); disc(w * .25, -h * .1, 1.4, C.stoneD, 0); }
  else if (m === 'metal'){ rr(-w / 2, -h / 2, w, h, 3); ink(p.st === 2 ? C.metalD : C.metal); const along = w >= h; if (along) for (let i = -w / 2 + 8; i < w / 2 - 4; i += 9) line(i, -h / 2 + 3, i, h / 2 - 3, C.metalD, 1.4); else for (let i = -h / 2 + 8; i < h / 2 - 4; i += 9) line(-w / 2 + 3, i, w / 2 - 3, i, C.metalD, 1.4);
    if (p.st >= 1){ g.beginPath(); g.ellipse(0, 0, w * .2, h * .2, .4, 0, 7); ink(C.metalD, 1.6); } }
  else if (m === 'crate'){ rr(-w / 2, -h / 2, w, h, 2); ink('#c23b3b'); for (let i = 0; i < 3; i++) disc(-w / 2 + 5 + i * (w - 10) / 2, -h / 2 + 4, 2, '#3a1210', 0); }
  if (p.st === 1 && m !== 'metal'){ seed = p.sd; g.beginPath(); let cx = (R() - .5) * w * .3, cy = -h / 2; const along = w >= h; if (along){ cx = -w / 2 + w * (.3 + R() * .4); cy = -h / 2; g.moveTo(cx, cy); for (let i = 0; i < 3; i++){ cx += (R() - .5) * 8; cy += h / 3; g.lineTo(cx, cy); } } else { cx = -w / 2; cy = -h / 2 + h * (.3 + R() * .4); g.moveTo(cx, cy); for (let i = 0; i < 3; i++){ cy += (R() - .5) * 8; cx += w / 3; g.lineTo(cx, cy); } } g.lineWidth = 1.8; g.strokeStyle = INK; g.stroke(); } }); }

// the ragdoll, drawn from its bodies
function limbDraw(b, col, w, endFn){ const e = ends(b); line(e[0], e[1], e[2], e[3], INK, w + LW * 1.6); line(e[0], e[1], e[2], e[3], col, w); if (endFn) endFn(e[2], e[3], b.angle); }
function shoe(x, y, a){ at(x, y, a, () => { rr(-5, -3, 13, 7, 3); ink(C.shoe, 2.2); }); }
function drawRag(){ const r = rag;
  limbDraw(r.ua2, C.hood2, 7); limbDraw(r.fa2, C.hood2, 6.5, (x, y) => disc(x, y, 4, C.skin, 2));
  if (r.mic && !r.mic.plugin.gone) at(r.mic.position.x, r.mic.position.y, r.mic.angle, () => { line(0, 6, 0, -3, INK, 4); disc(0, -6, 4.5, '#8d8a82', 2); });
  limbDraw(r.th2, C.jeansD, 8.5); limbDraw(r.sh2, C.jeansD, 8, shoe);
  const t = r.torso; at(t.position.x, t.position.y, t.angle, () => { rr(-12, -17, 24, 34, 9); ink(C.hood); g.beginPath(); g.ellipse(0, -16, 10, 4, 0, 0, Math.PI); ink(C.hood2, 2); rr(-6, 4, 12, 6, 2.5); ink(C.hood2, 1.8);
    [[-7.5, 3], [-4.5, 6], [-1.5, 10], [1.5, 6], [4.5, 3]].forEach(([bx, hh]) => { g.fillStyle = C.cream; g.fillRect(bx, -5 - hh / 2, 2, hh); }); });
  limbDraw(r.th1, C.jeans, 8.5); limbDraw(r.sh1, C.jeans, 8, shoe);
  head(r.head.position.x, r.head.position.y, r.head.angle, r.face, r.hat);
  limbDraw(r.ua1, C.hood2, 7); limbDraw(r.fa1, C.hood2, 6.5, (x, y) => disc(x, y, 4.2, C.skin, 2)); }
function head(x, y, a, face, hat){ at(x, y, a, () => { const L = Math.max(2, LW * .8);
  disc(0, 0, 17, C.skin, L);
  g.beginPath(); g.moveTo(-16.5, 2); g.quadraticCurveTo(-17, 18, 0, 19); g.quadraticCurveTo(17, 18, 16.5, 2); g.quadraticCurveTo(12, 9, 6, 8); g.quadraticCurveTo(0, 6, -6, 8); g.quadraticCurveTo(-12, 9, -16.5, 2); ink(C.beard, L);
  if (face === 'ouch'){ line(-8, -1, -3, 2, INK, 2); line(-8, 3, -3, -1, INK, 2); line(3, -1, 8, 2, INK, 2); line(3, 3, 8, -1, INK, 2); g.beginPath(); g.ellipse(1, 11, 4.5, 3.5, 0, 0, 7); ink('#5a2018', 1.8); }
  else if (face === 'rap'){ line(-7.5, 0, -2.5, 1, INK, 2); line(2.5, 1, 7.5, 0, INK, 2); line(-8, -4, -2.5, -3, INK, 1.5); line(2.5, -3, 8, -4, INK, 1.5); g.beginPath(); g.ellipse(0, 11, 4, 3, 0, 0, 7); ink('#5a2018', 1.8); }
  else if (face === 'out'){ line(-7.5, 1, -2.5, 1, INK, 2); line(2.5, 1, 7.5, 1, INK, 2); g.beginPath(); g.moveTo(-4, 11); g.quadraticCurveTo(0, 14, 4, 10); g.lineWidth = 1.8; g.strokeStyle = INK; g.stroke(); }
  else { disc(-5, 0, 3, '#fff', 1.5); disc(5, 0, 3, '#fff', 1.5); disc(-4.5, .5, 1.1, INK, 0); disc(5.5, .5, 1.1, INK, 0); g.beginPath(); g.ellipse(0, 12, 3.5, 4.5, 0, 0, 7); ink('#5a2018', 1.8); }
  if (hat){ g.beginPath(); g.arc(0, -2, 17.5, Math.PI * 1.05, Math.PI * 1.95); g.lineTo(16, -6); ink(C.beanie, L); rr(-18, -9, 36, 7, 3); ink('#555a52', L * .9); disc(3, -21, 3, C.beanie, L * .8); } }); }

// before the grab: a drawn, bouncing rapper, fist up, mic at the mouth
function drawRapper(x, y, t){ const beat = Math.sin(t * 2 * Math.PI * 1.45), dip = Math.abs(beat) * 6; const yy = y + dip;
  const lim = (ax, ay, a1, a2, l1, l2, col, w, end) => { const r1 = a1 * Math.PI / 180, r2 = (a1 + a2) * Math.PI / 180; const ex = ax + Math.sin(r1) * l1, ey = ay + Math.cos(r1) * l1, hx = ex + Math.sin(r2) * l2, hy = ey + Math.cos(r2) * l2;
    line(ax, ay, ex, ey, INK, w + LW * 1.6); line(ex, ey, hx, hy, INK, w + LW * 1.6); line(ax, ay, ex, ey, col, w); line(ex, ey, hx, hy, col, w); if (end) end(hx, hy, r2); return [hx, hy]; };
  const k = dip / 6;
  lim(x - 4, yy, -18 - k * 14, 26 + k * 34, 15, 15, C.jeansD, 8.5, (hx, hy) => shoe(hx, Math.min(hy, y + 29), 0));
  at(x, yy - 17, Math.sin(t * 2 * Math.PI * .72) * .05, () => { rr(-12, -17, 24, 34, 9); ink(C.hood); g.beginPath(); g.ellipse(0, -16, 10, 4, 0, 0, Math.PI); ink(C.hood2, 2); rr(-6, 4, 12, 6, 2.5); ink(C.hood2, 1.8);
    [[-7.5, 3], [-4.5, 6], [-1.5, 10], [1.5, 6], [4.5, 3]].forEach(([bx, hh]) => { g.fillStyle = C.cream; g.fillRect(bx, -5 - hh / 2, 2, hh); }); });
  lim(x + 4, yy, 18 + k * 14, -26 - k * 34, 15, 15, C.jeans, 8.5, (hx, hy) => shoe(hx, Math.min(hy, y + 29), 0));
  head(x + Math.sin(t * 2 * Math.PI * .72) * 1.5, yy - 49 + Math.abs(beat) * 1.5, Math.sin(t * 2 * Math.PI * .72) * .08, 'rap', true);
  // mic hand at the mouth
  lim(x - 5, yy - 28, -50, 215, 13, 12, C.hood2, 7, (hx, hy) => { line(hx, hy, hx + 7, hy - 2, INK, 4); disc(hx + 9, hy - 3, 4.2, '#8d8a82', 2); disc(hx, hy, 4, C.skin, 2); });
  // fist pumping on the beat
  const up = 140 + beat * 18; lim(x + 6, yy - 28, up, 20 - beat * 10, 14, 13, C.hood2, 7, (hx, hy, r) => at(hx, hy, r, () => { rr(-5, -2, 10, 10, 3); ink(C.skin, 2); }));
  if (state === 'stage'){ const hx = x + 25, hy = yy - 70; g.beginPath(); g.arc(hx, hy, 26 + Math.sin(t * 5) * 3, 0, 7); g.strokeStyle = 'rgba(236,228,204,.55)'; g.lineWidth = 2.5; g.setLineDash([6, 8]); g.stroke(); g.setLineDash([]); } }

function drawParts(){ for (const p of parts){ const k = 1 - p.t / p.life;
  if (p.k === 'smoke'){ g.globalAlpha = .55 * k; disc(p.x, p.y, p.s * (1.4 - k * .4), p.c, 2); g.globalAlpha = 1; }
  else if (p.k === 'flame'){ g.globalAlpha = k; disc(p.x, p.y, p.s * k, k > .5 ? '#ffb347' : '#e8572a', 0); g.globalAlpha = 1; }
  else if (p.k === 'spark'){ g.globalAlpha = k; line(p.x, p.y, p.x - p.vx * 1.5, p.y - p.vy * 1.5, p.c, p.s); g.globalAlpha = 1; }
  else if (p.k === 'shard'){ at(p.x, p.y, p.r, () => { g.globalAlpha = Math.min(1, k * 2); path([[0, 0], [p.s, p.s * .3], [p.s * .2, p.s]]); ink(C.glass, 1.5); g.globalAlpha = 1; }); }
  else { at(p.x, p.y, p.r, () => { g.globalAlpha = Math.min(1, k * 2); if (p.k === 'rubble') disc(0, 0, p.s * .6, C.stone, 1.6); else { rr(-p.s, -1.5, p.s * 2, 3, 1); ink(p.c, 1.4); } g.globalAlpha = 1; }); } } }
function drawBooms(){ for (const b of booms){ const k = b.t / .7, r = b.r * (.35 + k * .75); seed = Math.floor(b.x * 13 + b.y);
  const sp = 14, out = [], mid = [], core = []; for (let i = 0; i < sp * 2; i++){ const t = i / (sp * 2) * 6.283, f = i % 2 ? .62 : 1, j = .85 + R() * .3; out.push([b.x + Math.cos(t) * r * f * j, b.y + Math.sin(t) * r * f * j]); mid.push([b.x + Math.cos(t) * r * f * j * .7, b.y + Math.sin(t) * r * f * j * .7]); core.push([b.x + Math.cos(t) * r * f * .38, b.y + Math.sin(t) * r * f * .38]); }
  g.globalAlpha = 1 - k * k; path(out); ink('#e8572a', LW * 1.2); path(mid); g.fillStyle = '#ffb347'; g.fill(); if (k < .5){ path(core); g.fillStyle = '#fff2c4'; g.fill(); } g.globalAlpha = 1; } }
function drawArcs(){ for (const a of arcs){ g.beginPath(); g.moveTo(a.x1, a.y1); for (let i = 1; i < 8; i++){ const u = i / 8; g.lineTo(a.x1 + (a.x2 - a.x1) * u + (rnd() - .5) * 26, a.y1 + (a.y2 - a.y1) * u + (rnd() - .5) * 26); } g.lineTo(a.x2, a.y2); g.strokeStyle = '#cfe9ff'; g.lineWidth = 3; g.stroke(); g.strokeStyle = 'rgba(122,176,208,.5)'; g.lineWidth = 8; g.stroke(); } }
function drawPops(){ const z = baseZ() * cam.z; for (const p of pops){ const k = p.t / 1.6, y = p.y - k * 60; g.globalAlpha = k > .7 ? (1 - k) / .3 : 1; const fs = 24 / Math.max(.6, z);
  g.font = fs + 'px VT323'; g.textAlign = 'center'; const w = g.measureText(p.s).width + 16 / z; rr(p.x - w / 2, y - fs * .85, w, fs * 1.15, 5 / z); g.fillStyle = 'rgba(27,23,20,.85)'; g.fill(); g.fillStyle = p.col; g.fillText(p.s, p.x, y); g.globalAlpha = 1; } }

// ---------- main loop ----------
let last = 0, acc = 0, shownScore = -1;
function frame(ts){ requestAnimationFrame(frame); const t = ts / 1000, dt = Math.min(.05, last ? t - last : .016); last = t;
  if (engine && state !== 'start'){ if (state === 'stage' || state === 'grab' || state === 'fly' || state === 'over') simulate(dt); spawnAhead(); }
  camStep(dt); mixUpdate();
  draw(t);
  if (score !== shownScore){ shownScore = score; $('score').textContent = score.toLocaleString('fi-FI'); }
  if (rag && state === 'fly') $('dist').textContent = Math.max(0, Math.round(maxDist)) + ' M'; }
resize(); makeBg(); buildCurve(); planCourse();
engine = null; document.fonts && document.fonts.load('30px VT323');
newGame(); state = 'start'; $('hint').classList.remove('on');
requestAnimationFrame(frame);

// for testing
window.__heita = { get state(){ return state; }, get score(){ return score; }, get dist(){ return maxDist; }, get bodies(){ return bodies.length; }, get rag(){ return rag; }, tally:() => tally, combo:() => maxCombo,
  start(){ $('bgo').click(); },
  throwNow(vx, vy){ if (state !== 'stage') return; doGrab({x:STAGE.x + 30, y:STAGE.y - 150}); rag.all.forEach(b => Body.setVelocity(b, {x:vx, y:vy})); release(); rag.all.forEach(b => Body.setVelocity(b, {x:vx, y:vy})); },
  cam, dbg:() => ({mv: rag ? Math.max(...rag.all.filter(b => b !== rag.mic).map(b => Math.hypot(b.velocity.x, b.velocity.y))) : 0, timers: timers.length, rockets: rockets.length, restT, flyT, tv: rag && rag.throwV, parts: rag ? rag.all.map(b => Math.hypot(b.velocity.x, b.velocity.y).toFixed(2)) : []}) };
})();
